# Install once per clone:  pre-commit install
#
# nbstripout is the important one. Without it every notebook commit carries
# base64-encoded plot PNGs and an execution_count that changes on every run,
# which makes PR diffs unreadable and guarantees merge conflicts whenever two
# people touch the same notebook. Outputs are regenerated by `make report`.
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
