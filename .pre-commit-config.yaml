# Install once per clone:  pre-commit install
#
# nbstripout keeps base64-encoded plot PNGs and churning execution_counts out
# of scratch and template notebooks, where they make diffs unreadable and cause
# merge conflicts.
#
# The numbered chapter notebooks are deliberately exempt: they are the report,
# and readers open them directly on GitHub or in Jupyter, where a stripped
# notebook shows no figures or tables at all. They keep their outputs committed.
# `make report` still runs with --execute, so the published site is always
# rendered from a fresh run rather than from whatever is stored here.
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        exclude: '^notebooks/0[0-9]_.*\.ipynb$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
